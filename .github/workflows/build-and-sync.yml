name: Build and Sync Resume

on:
  push:
    branches: [main]
    paths:
      - 'resume.tex'
      - 'awesome-cv.cls'
      - 'fonts/**'
      - 'images/**'
      - '**/*.cls'
      - '.github/workflows/build-and-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "resume-build"
  cancel-in-progress: true

jobs:
  # Primary resume. Builds, publishes the rolling release, and syncs into
  # the portfolio repo.
  #
  # resume-plain.tex (the original single-column template) is kept in the
  # repo as a backup but is NOT built automatically - it's stable and not
  # changing, so it doesn't need CI time on every push. To rebuild it:
  #   latexmk -xelatex resume-plain.tex   (needs a local TeX install)
  # or add 'root_file: resume-plain.tex' to a manual run of this workflow.
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resume repo
        uses: actions/checkout@v7

      # The public build runs FIRST and with no private.tex present, so the
      # published PDF cannot contain personal data even if a later step fails.
      - name: Compile resume.tex with XeLaTeX (public)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true

      # The source stays resume.tex; the published file carries the author's
      # name so downloads and the release asset are self-describing.
      - name: Rename PDF for publishing
        run: mv resume.pdf Puneeth-Prakash-Resume.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: Puneeth-Prakash-Resume.pdf
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Resume"
          body: "Automatically built from ${{ github.sha }}. Always reflects the current resume.tex."
          prerelease: false
          make_latest: true
          files: Puneeth-Prakash-Resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone portfolio repository
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          git clone "https://x-access-token:${PORTFOLIO_PAT}@github.com/punitpi/typedbyme.git" portfolio-repo

      - name: Sync PDF into portfolio and push if changed
        env:
          PORTFOLIO_PAT: ${{ secrets.PORTFOLIO_PAT }}
        run: |
          set -euo pipefail

          # Filename case matters: the live site links static/files/Resume.pdf
          # (capital R). A lowercase copy creates a second, unreferenced file
          # on a case-sensitive filesystem and leaves the site serving the
          # stale PDF. Do not normalize the case.
          cp Puneeth-Prakash-Resume.pdf portfolio-repo/static/files/Resume.pdf

          cd portfolio-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/files/Resume.pdf

          # Guard on a real diff - an unchanged PDF must not fail the step
          # on an empty commit.
          if git diff --cached --quiet; then
            echo "Resume PDF unchanged - nothing to sync."
            exit 0
          fi

          git commit -m "chore: sync resume PDF from my-resume@${GITHUB_SHA}"

          # Intentionally no [skip ci]: this push must trigger the
          # portfolio's own Pages deploy workflow. A push authenticated with
          # a PAT (unlike the default GITHUB_TOKEN) does trigger downstream
          # workflows, which is what makes this chain reach the live site.
          git push "https://x-access-token:${PORTFOLIO_PAT}@github.com/punitpi/typedbyme.git" HEAD:main

      # ---------------------------------------------------------------------
      # Private variant. Contains the phone number and work-permit line, so it
      # must never reach a public surface: no artifact upload, no release
      # asset, no commit back to this repo. It goes only to the private
      # my-resume-private repo.
      #
      # Ordering is deliberate: this block runs LAST, after the public PDF has
      # been uploaded, released, and synced to the portfolio - so a failure
      # here (expired PAT, missing secret) cannot stop the public resume from
      # shipping. private.tex is written as late as possible and deleted
      # immediately after the compile, before any other step can pick it up.
      # ---------------------------------------------------------------------
      - name: Write private.tex from secret
        env:
          RESUME_PRIVATE_TEX: ${{ secrets.RESUME_PRIVATE_TEX }}
        run: |
          set -euo pipefail
          if [ -z "${RESUME_PRIVATE_TEX}" ]; then
            echo "::error::RESUME_PRIVATE_TEX secret is not set. Add it (contents of private.tex) or remove the private-sync steps."
            exit 1
          fi
          printf '%s\n' "${RESUME_PRIVATE_TEX}" > private.tex

      - name: Compile private variant with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          # args is word-split on spaces by the action, then it appends
          # -xelatex itself (because latexmk_use_xelatex is true) - so do NOT
          # repeat -xelatex here. Every flag below must be space-free.
          # -jobname keeps this output separate from the public resume.pdf,
          # which at this point has already been renamed and published.
          args: -interaction=nonstopmode -halt-on-error -file-line-error -usepretex=\def\privatebuild{} -jobname=Puneeth-Prakash-Resume-private

      # Delete the secret material as soon as the compile is done. Everything
      # after this point runs in a workspace with no personal data in it.
      - name: Shred private.tex
        if: always()
        run: rm -f private.tex

      - name: Sync private PDF into my-resume-private
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${PRIVATE_REPO_PAT}" ]; then
            echo "::error::PRIVATE_REPO_PAT secret is not set - the private resume copy would go stale."
            exit 1
          fi

          test -f Puneeth-Prakash-Resume-private.pdf

          git clone --depth 1 \
            "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/punitpi/my-resume-private.git" private-repo

          cp Puneeth-Prakash-Resume-private.pdf private-repo/Puneeth-Prakash-Resume.pdf

          cd private-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Puneeth-Prakash-Resume.pdf

          if git diff --cached --quiet; then
            echo "Private resume PDF unchanged - nothing to sync."
            exit 0
          fi

          git commit -m "chore: sync private resume PDF from my-resume@${GITHUB_SHA}"
          git push "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/punitpi/my-resume-private.git" HEAD:main

      # Belt and braces: the private PDF must not be left in the workspace for
      # any future step added below to publish by accident. Both cleanup steps
      # are if: always() so they run even when the compile or sync fails.
      - name: Remove private PDF from workspace
        if: always()
        run: rm -f Puneeth-Prakash-Resume-private.pdf
